openapi: 3.0.0
info:
  title: CAB System API - Xem báo cáo
  description: API cung cấp báo cáo tổng hợp cho Nhân viên vận hành, Bộ phận tài chính, Ban giám đốc (UC-13).
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com/v1
paths:
  /reports:
    get:
      summary: Xem báo cáo thống kê (UC-13)
      description: Trả về số liệu tổng số chuyến, doanh thu, tỷ lệ hoàn thành/hủy theo khoảng thời gian.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Dữ liệu báo cáo
        '403':
          description: Không đủ quyền xem báo cáo (Luồng ngoại lệ E1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: SAMPLE_ERROR
        message:
          type: string
          example: Mô tả lỗi
