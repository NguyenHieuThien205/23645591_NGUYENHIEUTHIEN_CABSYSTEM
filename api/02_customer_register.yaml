openapi: 3.0.0
info:
  title: CAB System API - Đăng ký tài khoản
  description: API cho phép Khách hàng/Tài xế đăng ký tài khoản mới (UC-02).
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com/v1
paths:
  /auth/register:
    post:
      summary: Đăng ký tài khoản mới (UC-02)
      description: Người dùng nhập thông tin cá nhân, số điện thoại/tên đăng nhập và mật khẩu để tạo tài
        khoản mới.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fullName
              - phone
              - password
              - role
              properties:
                fullName:
                  type: string
                  example: Nguyễn Văn A
                phone:
                  type: string
                  example: 0912345678
                password:
                  type: string
                  format: password
                role:
                  type: string
                  enum:
                  - CUSTOMER
                  - DRIVER
      responses:
        '201':
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  fullName:
                    type: string
                  phone:
                    type: string
                  role:
                    type: string
                    enum:
                    - CUSTOMER
                    - DRIVER
                  status:
                    type: string
                    example: PENDING_ACTIVATION
        '400':
          description: Dữ liệu đăng ký không hợp lệ (Luồng ngoại lệ E2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Số điện thoại/tên đăng nhập đã tồn tại (Luồng ngoại lệ E1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: SAMPLE_ERROR
        message:
          type: string
          example: Mô tả lỗi
