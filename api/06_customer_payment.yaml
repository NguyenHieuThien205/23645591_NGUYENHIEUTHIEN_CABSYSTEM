openapi: 3.0.0
info:
  title: CAB System API - Thanh toán
  description: API xử lý thanh toán chi phí chuyến đi bằng tiền mặt hoặc điện tử (UC-06).
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com/v1
paths:
  /rides/{rideId}/payment:
    post:
      summary: Thanh toán chuyến đi (UC-06)
      description: Khách hàng chọn phương thức thanh toán; nếu là điện tử, hệ thống gửi yêu cầu tới Payment
        Provider.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              properties:
                method:
                  type: string
                  enum:
                  - CASH
                  - E_WALLET
      responses:
        '200':
          description: Thanh toán thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionId:
                    type: string
                    format: uuid
                  amount:
                    type: number
                  method:
                    type: string
                    enum:
                    - CASH
                    - E_WALLET
                  status:
                    type: string
                    enum:
                    - SUCCESS
                    - FAILED
        '402':
          description: Thanh toán điện tử thất bại (Luồng ngoại lệ E1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy chuyến đi hoặc chưa phát sinh cước phí
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: rideId
        in: path
        required: true
        schema:
          type: string
          format: uuid
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: SAMPLE_ERROR
        message:
          type: string
          example: Mô tả lỗi
