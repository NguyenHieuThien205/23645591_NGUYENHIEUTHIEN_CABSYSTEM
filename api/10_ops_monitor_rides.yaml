openapi: 3.0.0
info:
  title: CAB System API - Giám sát chuyến đi (Vận hành)
  description: API cho Nhân viên vận hành theo dõi các chuyến đang diễn ra (UC-10).
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com/v1
paths:
  /ops/rides:
    get:
      summary: Danh sách chuyến đang diễn ra (UC-10)
      description: Trả về danh sách chuyến đi và trạng thái tài xế thực tế, hỗ trợ lọc theo trạng thái.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách chuyến đi
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: SAMPLE_ERROR
        message:
          type: string
          example: Mô tả lỗi
