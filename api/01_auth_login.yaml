openapi: 3.0.0
info:
  title: CAB System API - Xác thực
  description: API đăng nhập cho các actor có tài khoản trên hệ thống CAB (Khách hàng, Tài xế, Nhân viên vận hành, Quản trị viên, Bộ phận tài chính, Ban giám đốc).
  version: 1.0.0

servers:
  - url: https://api.cabsystem.example.com/v1

tags:
  - name: Auth
    description: Xác thực và quản lý phiên đăng nhập

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Đăng nhập hệ thống (UC-01)
      description: >
        Người dùng cung cấp thông tin xác thực (số điện thoại/tên đăng nhập và mật khẩu).
        Hệ thống kiểm tra tài khoản, mật khẩu, trạng thái tài khoản, xác định vai trò
        và trả về access token tương ứng với quyền truy cập của vai trò đó.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  description: Số điện thoại hoặc tên đăng nhập
                  example: "0912345678"
                password:
                  type: string
                  format: password
                  example: "MatKhau123!"
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  tokenType:
                    type: string
                    example: Bearer
                  expiresIn:
                    type: integer
                    example: 3600
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      fullName:
                        type: string
                      role:
                        type: string
                        enum:
                          - CUSTOMER
                          - DRIVER
                          - OPERATION_STAFF
                          - ADMIN
                          - FINANCE
                          - MANAGEMENT
                      status:
                        type: string
                        enum:
                          - ACTIVE
                          - INACTIVE
                          - LOCKED
        "400":
          description: Thiếu dữ liệu bắt buộc (identifier hoặc password trống)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Số điện thoại/tên đăng nhập hoặc mật khẩu không chính xác (Luồng ngoại lệ E1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            Tài khoản bị khóa (E2) hoặc tài khoản chưa được kích hoạt (E3).
            Xem trường `errorCode` để phân biệt: ACCOUNT_LOCKED | ACCOUNT_NOT_ACTIVATED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Đăng xuất hệ thống (UC-08)
      description: Kết thúc phiên đăng nhập hiện tại của người dùng.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Đăng xuất thành công"
        "401":
          description: Phiên đăng nhập đã hết hạn hoặc không hợp lệ (Luồng ngoại lệ E1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: "INVALID_CREDENTIALS"
        message:
          type: string
          example: "Số điện thoại hoặc mật khẩu không chính xác"
