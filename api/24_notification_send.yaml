openapi: 3.0.0
info:
  title: CAB System API - Gửi thông báo
  description: API gửi thông báo tới Khách hàng/Tài xế thông qua Notification Provider (UC-24).
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com/v1
paths:
  /notifications/send:
    post:
      summary: Gửi thông báo (UC-24)
      description: Hệ thống gửi yêu cầu tới Notification Provider để chuyển thông báo qua Push/SMS/Email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - recipientId
              - channel
              - content
              properties:
                recipientId:
                  type: string
                  format: uuid
                channel:
                  type: string
                  enum:
                  - PUSH
                  - SMS
                  - EMAIL
                content:
                  type: string
      responses:
        '202':
          description: Yêu cầu gửi thông báo đã được tiếp nhận
        '400':
          description: Thông tin người nhận không hợp lệ (Luồng ngoại lệ E2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Không gửi được thông báo, Notification Provider lỗi (Luồng ngoại lệ E1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: SAMPLE_ERROR
        message:
          type: string
          example: Mô tả lỗi
