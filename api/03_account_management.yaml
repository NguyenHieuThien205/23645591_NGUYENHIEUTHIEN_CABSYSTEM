openapi: 3.0.0
info:
  title: CAB System API - Quản lý tài khoản
  description: API xem và cập nhật thông tin tài khoản (UC-03), dùng chung cho Khách hàng, Tài xế, Quản
    trị viên.
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com/v1
paths:
  /accounts/{accountId}:
    get:
      summary: Xem thông tin tài khoản
      description: Truy xuất thông tin chi tiết của một tài khoản.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Trả về thông tin tài khoản
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  fullName:
                    type: string
                  email:
                    type: string
                  phone:
                    type: string
                  role:
                    type: string
                  status:
                    type: string
        '403':
          description: Không có quyền xem tài khoản này
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy tài khoản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Cập nhật thông tin tài khoản
      description: Cập nhật họ tên, email hoặc các thông tin cá nhân khác.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Cập nhật thành công
        '400':
          description: Thông tin không hợp lệ (Luồng ngoại lệ E1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền cập nhật (Luồng ngoại lệ E2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: SAMPLE_ERROR
        message:
          type: string
          example: Mô tả lỗi
