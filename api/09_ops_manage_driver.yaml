openapi: 3.0.0
info:
  title: CAB System API - Quản lý tài xế (Vận hành)
  description: API cho Nhân viên vận hành/Quản trị viên quản lý hồ sơ tài xế (UC-09).
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com/v1
paths:
  /ops/drivers:
    get:
      summary: Danh sách tài xế
      description: Tìm kiếm và liệt kê tài xế theo bộ lọc.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách tài xế
    post:
      summary: Tạo hồ sơ tài xế mới
      description: Nhân viên vận hành tạo tài khoản tài xế mới.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fullName
              - phone
              properties:
                fullName:
                  type: string
                phone:
                  type: string
      responses:
        '201':
          description: Tạo tài xế thành công
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ops/drivers/{driverId}:
    put:
      summary: Cập nhật hồ sơ tài xế
      description: Cập nhật thông tin cá nhân/phương tiện của tài xế.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Cập nhật thành công
        '404':
          description: Không tìm thấy tài xế (Luồng ngoại lệ E2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: driverId
        in: path
        required: true
        schema:
          type: string
          format: uuid
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: SAMPLE_ERROR
        message:
          type: string
          example: Mô tả lỗi
