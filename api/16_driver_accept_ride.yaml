openapi: 3.0.0
info:
  title: CAB System API - Nhận chuyến
  description: API cho Tài xế chấp nhận hoặc từ chối chuyến được đề xuất (UC-16).
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com/v1
paths:
  /rides/{rideId}/accept:
    post:
      summary: Chấp nhận chuyến (UC-16)
      description: Tài xế xác nhận nhận chuyến được hệ thống/nhân viên vận hành đề xuất.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Nhận chuyến thành công
        '409':
          description: Chuyến đã được tài xế khác nhận (Luồng ngoại lệ E1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: rideId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /rides/{rideId}/reject:
    post:
      summary: Từ chối chuyến (Luồng thay thế A1)
      description: Tài xế từ chối chuyến, hệ thống chuyển yêu cầu sang tài xế khác.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Từ chối thành công, chuyến được chuyển tiếp
      parameters:
      - name: rideId
        in: path
        required: true
        schema:
          type: string
          format: uuid
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: SAMPLE_ERROR
        message:
          type: string
          example: Mô tả lỗi
