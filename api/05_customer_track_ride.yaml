openapi: 3.0.0
info:
  title: CAB System API - Theo dõi chuyến đi
  description: API cho phép Khách hàng theo dõi trạng thái, vị trí tài xế và ETA (UC-05).
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com/v1
paths:
  /rides/{rideId}/tracking:
    get:
      summary: Theo dõi trạng thái chuyến đi theo thời gian thực (UC-05)
      description: Trả về trạng thái hiện tại của chuyến, vị trí tài xế gần nhất và thời gian dự kiến
        đến (ETA).
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Trả về thông tin theo dõi chuyến
          content:
            application/json:
              schema:
                type: object
                properties:
                  rideId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                    - FINDING_DRIVER
                    - DRIVER_ASSIGNED
                    - ARRIVED_PICKUP
                    - IN_PROGRESS
                    - COMPLETED
                  driverLocation:
                    type: object
                    properties:
                      latitude:
                        type: number
                      longitude:
                        type: number
                  etaMinutes:
                    type: integer
                    example: 5
        '404':
          description: Không tìm thấy chuyến đi (Luồng ngoại lệ E1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: rideId
        in: path
        required: true
        schema:
          type: string
          format: uuid
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: SAMPLE_ERROR
        message:
          type: string
          example: Mô tả lỗi
