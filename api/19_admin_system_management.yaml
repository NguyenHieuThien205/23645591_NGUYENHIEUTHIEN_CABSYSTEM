openapi: 3.0.0
info:
  title: CAB System API - Quản trị hệ thống
  description: API cho Quản trị viên quản lý phân quyền và thiết lập hệ thống (UC-19).
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com/v1
paths:
  /admin/roles:
    get:
      summary: Xem danh sách vai trò và phân quyền
      description: Trả về cấu hình RBAC hiện tại.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách vai trò
    put:
      summary: Cập nhật phân quyền
      description: Quản trị viên cập nhật quyền hạn cho vai trò Nhân viên vận hành.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Cập nhật phân quyền thành công
        '403':
          description: Không đủ quyền quản trị (Luồng ngoại lệ E1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: SAMPLE_ERROR
        message:
          type: string
          example: Mô tả lỗi
